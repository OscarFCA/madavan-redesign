<style>
@keyframes planea{0%,100%{transform:translate(400px,288px) rotate(-13deg) translate(-400px,-286px)}
  50%{transform:translate(400px,278px) rotate(-13deg) translate(-400px,-286px)}}
@keyframes avanza{to{stroke-dashoffset:-200}}
@keyframes pasa{0%{transform:translateX(30px);opacity:0}
  16%,84%{opacity:1}100%{transform:translateX(-130px);opacity:0}}
#avion{animation:planea 4.6s ease-in-out infinite}
#ruta{animation:avanza 5s linear infinite}
.nube{animation:pasa 13s linear infinite}
.nube{animation:pasa 13s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>

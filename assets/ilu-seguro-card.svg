<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 800 400" width="800" height="400" style="background:#EEF5FB" role="img" aria-label="Escudo protegiendo la carga">
<style>
@keyframes late{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes traza{to{stroke-dashoffset:0}}
@keyframes flota{0%,100%{transform:translateY(0);opacity:.8}50%{transform:translateY(-7px);opacity:.35}}
#sello{animation:late 3.4s ease-in-out infinite}
#palomita{animation:traza .85s cubic-bezier(.65,0,.35,1) .35s forwards}
.chispa{animation:flota 5.5s ease-in-out infinite}
.c1{animation-delay:-1.4s}.c2{animation-delay:-2.8s}.c3{animation-delay:-4.1s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="800" height="600" fill="#EEF5FB"/>

<path d="M400 168 L578 232 V352 C578 428 508 482 400 516 C292 482 222 428 222 352 V232 Z" fill="none" stroke="#5A6B7D" stroke-width="5" opacity=".45"/>
<g transform="translate(400 330)">
<path d="M-92 -44 L0 -84 L92 -44 L0 -4 Z" fill="#5A6B7D"/>
<path d="M-92 -44 V62 L0 102 V-4 Z" fill="#EEF5FB"/>
<path d="M92 -44 V62 L0 102 V-4 Z" fill="#DCE6F0"/>
<path d="M-92 -44 L0 -4 L92 -44" fill="none" stroke="#011C36" stroke-width="5" stroke-linejoin="round"/>
<path d="M0 -4 V102" stroke="#011C36" stroke-width="5"/>
</g>
<circle id="sello" cx="546" cy="432" r="52" fill="#0486DC" style="transform-origin:546px 432px"/>
<path id="palomita" d="M522 432 L540 452 L574 412" fill="none" stroke="#EEF5FB" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="78" stroke-dashoffset="78"/>
<circle class="chispa c0" cx="176" cy="160" r="9" fill="#5A6B7D" opacity=".8"/>
<circle class="chispa c1" cx="646" cy="152" r="7" fill="#5A6B7D" opacity=".8"/>
<circle class="chispa c2" cx="132" cy="420" r="7" fill="#5A6B7D" opacity=".8"/>
<circle class="chispa c3" cx="684" cy="486" r="9" fill="#5A6B7D" opacity=".8"/>
</svg>

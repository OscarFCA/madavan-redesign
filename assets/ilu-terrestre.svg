.rueda{animation:rueda 1.5s linear infinite}
#raya{animation:raya 1.6s linear infinite}
#faro{animation:brillo 1.8s ease-in-out infinite}
#camion{animation:vibra .55s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
